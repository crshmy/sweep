<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한해협 해양쓰레기 핫스팟</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend h4 {
            margin: 0 0 10px 0;
        }
        .legend-item {
            margin: 5px 0;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            display: inline-block;
            margin-right: 5px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 지도 초기화 (대한해협 중심)
        const map = L.map('map').setView([34.5, 129.0], 7);
        
        // 타일 레이어 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // 핫스팟 데이터 (일본 보고서 기반)
        const hotspots = [
            {
                name: "대한해협 북부",
                lat: 35.0,
                lng: 129.5,
                density: "높음",
                description: "대마난류 주 경로, 부유 쓰레기 집중 예상 구역",
                color: "#FF0000"
            },
            {
                name: "대한해협 중앙",
                lat: 34.5,
                lng: 129.0,
                density: "중간",
                description: "해류 수렴 지역",
                color: "#FFA500"
            },
            {
                name: "제주 남서부",
                lat: 33.0,
                lng: 126.0,
                density: "높음",
                description: "동중국해→대한해협 진입점",
                color: "#FF0000"
            },
            {
                name: "부산 남동부",
                lat: 35.0,
                lng: 130.0,
                density: "중간",
                description: "대한해협 출구, 일본으로 이동 전",
                color: "#FFA500"
            },
            {
                name: "울산 동부",
                lat: 35.5,
                lng: 130.0,
                density: "낮음",
                description: "동해 유입 지점",
                color: "#FFFF00"
            }
        ];
        
        // 일본 조사 지점 (보고서 Table IV-1 기반)
        const japanSurvey = [
            {
                name: "신요마루 No.5",
                lat: 31 + 10.9/60,
                lng: 127 + 23.1/60,
                depth: "116m",
                date: "2021/7/15"
            },
            {
                name: "신요마루 No.6",
                lat: 31 + 17.0/60,
                lng: 127 + 40.8/60,
                depth: "137m",
                date: "2021/7/18"
            }
        ];
        
        // 핫스팟 마커 추가
        hotspots.forEach(spot => {
            const marker = L.circleMarker([spot.lat, spot.lng], {
                radius: spot.density === "높음" ? 15 : spot.density === "중간" ? 10 : 7,
                fillColor: spot.color,
                color: "#000",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.6
            }).addTo(map);
            
            marker.bindPopup(`
                <b>${spot.name}</b><br>
                예상 밀도: <b>${spot.density}</b><br>
                ${spot.description}<br>
                <small>출처: 일본 환경성 조사 (2021)</small>
            `);
        });
        
        // 일본 조사 지점 추가
        japanSurvey.forEach(point => {
            L.marker([point.lat, point.lng], {
                icon: L.divIcon({
                    className: 'japan-survey',
                    html: '<div style="background:#0066FF;color:white;padding:5px;border-radius:3px;font-size:10px;">📍</div>'
                })
            }).addTo(map).bindPopup(`
                <b>${point.name}</b><br>
                수심: ${point.depth}<br>
                조사일: ${point.date}
            `);
        });
        
        // 범례 추가
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>쓰레기 밀도 범례</h4>
                <div class="legend-item">
                    <span class="legend-color" style="background:#FF0000"></span>높음
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background:#FFA500"></span>중간
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background:#FFFF00"></span>낮음
                </div>
                <hr>
                <div class="legend-item">
                    📍 일본 조사 지점 (2021)
                </div>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
